<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Electronics Engineering Animation</title>
</head>
<body class="min-h-screen bg-[#050816] font-sans text-white overflow-y-auto">
  <main class="relative flex mt-16 min-h-screen items-start justify-center overflow-visible pt-5">

  <!-- Tailwind -->
  <script src="./tailwindcss.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ["Poppins", "sans-serif"]
          },
          animation: {
            float: "float 6s ease-in-out infinite",
            glow: "glow 3s ease-in-out infinite alternate",
            drift: "drift 12s linear infinite"
          },
          keyframes: {
            float: {
              "0%, 100%": { transform: "translateY(0px)" },
              "50%": { transform: "translateY(-15px)" }
            },
            glow: {
              "0%": {
                boxShadow: "0 0 30px rgba(0,255,200,.2)"
              },
              "100%": {
                boxShadow: "0 0 80px rgba(0,255,200,.7)"
              }
            },
            drift: {
              "0%": {
                transform: "translateY(0px)",
                opacity: 0
              },
              "10%": {
                opacity: 1
              },
              "100%": {
                transform: "translateY(-120px)",
                opacity: 0
              }
            }
          }
        }
      }
    };
  </script>

  <style>
    body {
      overflow-x: hidden;
      background: #050816;
    }

    .glass {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .particle {
      position: absolute;
      color: rgba(0,255,170,0.2);
      font-size: 12px;
      pointer-events: none;
      animation: drift linear infinite;
    }

    .fade-up {
      opacity: 0;
      transform: translateY(30px);
      animation: fadeUp 1s ease forwards;
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .grid-bg {
      background-image:
        linear-gradient(rgba(0,255,170,.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,170,.08) 1px, transparent 1px);

      background-size: 60px 60px;
    }
  </style>
</head>

<body class="min-h-screen text-white font-sans">

  <!-- Background -->
  <div class="fixed inset-0 grid-bg opacity-30"></div>

  <!-- Glow Effects -->
  <div class="fixed top-0 left-0 h-[500px] w-[500px] rounded-full bg-cyan-500/20 blur-3xl"></div>
  <div class="fixed bottom-0 right-0 h-[500px] w-[500px] rounded-full bg-emerald-500/20 blur-3xl"></div>

  <!-- Particles -->
  <div id="particles" class="fixed inset-0 overflow-hidden"></div>

  <!-- Main -->
  <main class="relative z-10 flex min-h-screen items-center justify-center px-6 py-20">

    <section class="fade-up mx-auto max-w-6xl text-center">

      <!-- Orbit System -->
      <div class="relative mb-32 md:mb-40 flex items-center justify-center">

        <!-- Rings -->
        <div class="absolute h-[380px] w-[380px] rounded-full border border-cyan-400/20 animate-spin [animation-duration:20s]"></div>

        <div class="absolute h-[280px] w-[280px] rounded-full border border-emerald-400/20 animate-spin [animation-duration:14s] [animation-direction:reverse]"></div>

        <!-- Orbit Dots -->
        <div class="absolute h-[420px] w-[420px] animate-spin [animation-duration:18s]">

          <div class="absolute top-0 left-1/2 h-5 w-5 -translate-x-1/2 rounded-full bg-cyan-400 shadow-[0_0_20px_#22d3ee]"></div>

          <div class="absolute bottom-0 left-1/2 h-5 w-5 -translate-x-1/2 rounded-full bg-emerald-400 shadow-[0_0_20px_#10b981]"></div>

          <div class="absolute left-0 top-1/2 h-5 w-5 -translate-y-1/2 rounded-full bg-cyan-300 shadow-[0_0_20px_#67e8f9]"></div>

          <div class="absolute right-0 top-1/2 h-5 w-5 -translate-y-1/2 rounded-full bg-emerald-300 shadow-[0_0_20px_#6ee7b7]"></div>
        </div>

        <!-- Core -->
        <div class="animate-glow animate-float relative flex h-44 w-44 items-center justify-center rounded-full bg-gradient-to-br from-cyan-400 to-emerald-400">

          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-24 w-24 text-black"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="1.5">

            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M9.75 3v2.25m4.5-2.25v2.25M9 18.75v2.25m6-2.25v2.25M3 9.75h2.25m13.5 0H21M3 14.25h2.25m13.5 0H21M7.5 6.75h9A1.5 1.5 0 0118 8.25v7.5A1.5 1.5 0 0116.5 17.25h-9A1.5 1.5 0 016 15.75v-7.5A1.5 1.5 0 017.5 6.75z" />
          </svg>

        </div>
      </div>

      <!-- Title -->
      <h1 class="mb-8 bg-gradient-to-r from-cyan-300 via-white to-emerald-300 bg-clip-text text-5xl font-black tracking-tight text-transparent md:text-7xl lg:text-8xl">
        ELECTRONICS
        <br />
        ENGINEERING
      </h1>

      <!-- Description -->
      <p class="mx-auto max-w-3xl text-lg leading-relaxed text-slate-300 md:text-xl">
        Building intelligent systems, embedded technologies,
        autonomous robotics, and futuristic electronic innovations
        for the next generation of engineering.
      </p>

      <!-- Drone -->
      <div class="mt-16">
        <div class="glass inline-block rounded-3xl p-4 shadow-2xl">

          <img
            src="gif/drone.gif"
            alt="Drone Animation"
            class="w-full max-w-3xl rounded-2xl object-cover" />

        </div>
      </div>

      <!-- Tech Tags -->
      <div class="mt-16 flex flex-wrap items-center justify-center gap-5">

        <div class="glass rounded-full px-6 py-3 transition duration-300 hover:scale-105 hover:border-cyan-400/40">
          Microcontrollers
        </div>

        <div class="glass rounded-full px-6 py-3 transition duration-300 hover:scale-105 hover:border-cyan-400/40">
          Embedded Systems
        </div>

        <div class="glass rounded-full px-6 py-3 transition duration-300 hover:scale-105 hover:border-cyan-400/40">
          Circuit Design
        </div>

        <div class="glass rounded-full px-6 py-3 transition duration-300 hover:scale-105 hover:border-cyan-400/40">
          Robotics
        </div>

        <div class="glass rounded-full px-6 py-3 transition duration-300 hover:scale-105 hover:border-cyan-400/40">
          IoT Systems
        </div>

        <div class="glass rounded-full px-6 py-3 transition duration-300 hover:scale-105 hover:border-cyan-400/40">
          Signal Processing
        </div>

      </div>

    </section>

  </main>

  <script>
    const particlesContainer = document.getElementById("particles");

    const values = ["1010", "0101", "1100", "0011"];

    for (let i = 0; i < 35; i++) {

      const particle = document.createElement("div");

      particle.className = "particle";

      particle.textContent =
        values[Math.floor(Math.random() * values.length)];

      particle.style.left = Math.random() * 100 + "%";

      particle.style.top = Math.random() * 100 + "%";

      particle.style.animationDuration =
        5 + Math.random() * 10 + "s";

      particle.style.animationDelay =
        Math.random() * 5 + "s";

      particlesContainer.appendChild(particle);
    }
  </script>

</body>
</html>
